apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-java-Deployment
spec: 
  replicas: 2
  selector: 
    matchLabels:
      app: hello-java
  template:
    metadata:
      labels:
        app: hello-java
    spec:
    containers:
      - name: hello-java-container
        image: knoweygroups8/hello-java-app:latest
        args: ["knowey"]